# Robolectric を使うテスト(スクリーンショット・Room マイグレーション)の共通設定
# 描画の差分が出ないよう SDK を固定する
sdk=36
# @HiltAndroidApp の EchoMarkApplication は起動時に WorkManager 等を初期化するため、素の Application で動かす
application=android.app.Application
# 部品単体のスクショは中身の大きさで切り出されるが、ウィンドウより大きい分は切れるため縦長にしておく。
# 画面全体を撮るテストは @Config(qualifiers = RobolectricDeviceQualifiers.Pixel7) などで上書きする
qualifiers=w400dp-h1600dp-xhdpi
